  recipes:
    - APPLE
    - SWEET_BERRIES
    - WT_ZSHULUOBO
    - BEETROOT
    - CARROT
    - CHORUS_FRUIT
    - GLOW_BERRIES
    - GOLDEN_APPLE
    - ENCHANTED_GOLDEN_APPLE
    - MELON_SLICE
    - POTATO
    - POISONOUS_POTATO
