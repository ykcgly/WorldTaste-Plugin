item:
  WORLDTASTE_INFO:
    name: '&f&l信息'
    lore:
      - '&7本附属由海曼（haiman）编写而成'
      - '&7旨在向粘液科技中加入包含世界各地的美食'
      - '&7这些美食能补充您的饥饿值/饱和度，并降低消耗度'
      - '&7每个食品都会依据其提供的饥饿值和饱食度'
      - '&7成比例的降低玩家的消耗度（这是其它食物不具备的特性）'
      - '&7所以，食用本附属的食品将更不容易使你再次饥饿'
  WORLDTASTE_VERSINO:
    name: '&f&l版本号'
    lore:
      - '&f当前版本:'
      - '&bRelease-1.10.2'
      - '&7您在提issues的时候需要展示这个'
      - '&7如果尘世百味加载不完全，请先检查服务器是否安装了美食家和异域花园附属'
      - '&7尘世百味附属始于2025年1月12日'
  WORLDTASTE_TNANKS:
    name: '&f&l鸣谢'
    lore:
      - '&7感谢大香蕉和Eventually在脚本编写上给予的大力支持'
      - '&7感谢大香蕉编写的rsc editor大幅降低了编写的繁琐程度'
      - '&7感谢南柯梦在作物的编写上提供指导'
      - '&7感谢&e&o云梦都服务器&r&7提供jar版本测试'
  WORLDTASTE_WENTI:
    name: '&a&n遇到问题了？'
    lore:
      - '&7这时候请再仔细检查一次，确认不是自己造成的问题，并且已经更新到最新版'
      - '&7如果发现无法解决并且确认为本附属的问题'
      - '&7可以在github上提issue(https://github.com/ykcgly/WorldTaste-Plugin)'
      - '&7当然如果你有好的建议或者想法'
      - '&7也可以告诉我喵'
  WORLDTASTE_HOJI:
    name: '&e&l后记'
    lore:
      - '&72026年8月18日，海曼系列附属宣布停更'
      - '&7尘百由hershate改为独立插件版本'
      - '&7提供了更好的性能'
      - '&7由养坤场管理员提供bug修复'
  WT_HAIMAN:
    name: '&6海曼&7（MC：&6haiman&7）'
    lore:
      - '&6海曼系列附属作者'
      - '&6粘液科技元老级附属作者'
      - '&7在这个遍地ai的时代'
      - '&7老一辈艺术家还在坚持手搓'
  WT_ZTF3:
    name: '&b乐乐趴趴&7（MC：&bZTF3&7）'
    lore:
      - '&e尘世百味附属维护者'
      - '&a承担了将尘世百味从rsc转味jar的部分'
      - '&7&m赤石继承人'
  WT_YKCGLY:
    name: '&d养坤场管理员&7（MC：&dykcgly&7）'
    lore:
      - '&e尘世百味附属维护者'
      - '&a将附属兼容了slimefun4'
      - '&a修复了大量bug与增加了一些特性'
      - '&7&m这其实是猫娘'
  WORLDTASTE_TIP:
    name: '&f&l贴士'
    lore:
      - '&6&l饥饿值：&e就是显示在屏幕上的鸡腿'
      - '&6&l饱和度：&e在饥饿值被消耗前会首先被消耗，其值不能超过目前的饥饿值（饥饿值越高，饱和度收益越高）'
      - '&6&l消耗度：&e在玩家从事特定活动时会增加消耗度（如疾跑，跳跃，挖掘，饥饿效果等）。当消耗度到达4时，就会重置为0并扣除1点饥饿值或饱和度。'
      - '&6&l满饥饿值生命恢复速率：&e当饥饿值满的时候，恢复血量的时间间隔（值越小越快）'
      - '&6&l半饥饿值生命恢复速率：&e当饥饿值未满的时候，恢复血量的时间间隔（值越小越快）'
      - '&6&l饥饿掉血速率：&e当饥饿值为空时，扣血的时间间隔（值越大越慢）'
      - '&6&l温暖：&e玩家落入细雪进入冻结状态的时间更长'
      - '&6&l氧气值：&e潜水时的氧气条'
      - '&6&l最大氧气值：&e氧气条上限'
      - '&6&l伤害吸收量：&e就是金心'
