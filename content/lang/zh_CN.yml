  WT_NIANZAO_INFO:
    name: '&e酿造工艺介绍'
    lore:
      - '&e全新分类--酿造工艺'
      - '&e为尘百添加了近乎无限种类的饮品'
      - '&7&m灵感来源于一天晚上做梦梦到酒狐踩葡萄酒'
  WT_NIANZAO_JIESAO:
    name: '&b说明'
    lore:
      - '&b这个分类主要添加了两种机器'
      - '&b榨汁盆与酒窖管理器'
      - '&b可以在榨汁盆中投入食材进行榨汁'
      - '&b具体配方可以查看粘液指南界面'
      - '&b获取的汁水可以直接食用，或者放入酒窖中进一步酿造来获得酒水'
  WT_NIANZAO_TEXING:
    name: '&e新的特性'
    lore:
      - '&b榨汁盆一次最多能放入10种物品，物品总数量上限10个'
      - '&7可以理解为容量为10的收纳袋'
      - '&b产出的物品都会有你放入的物品'
      - '&b也就是说你可以在一瓶的汁水里面见到10种食材'
      - '&b你还能将其倒入酒窖进行陈酿'
      - '&b陈酿后的果汁会带上酒精度'
      - '&b酒精度取决于放入的汁水的总糖分*转化率（默认0.3）+酒曲加成'
      - '&7初级酒曲+0 酒曲+3 中级酒曲+6 高级酒曲+15 特级酒曲+30'
      - '&b在酿造完成后可以直接进行陈酿'
      - '&b酿造不限时间&m越老越香醇'
      - '&b默认酒精度每日增长5%~15%'
  WT_GUOZHA:
    name: '&7果渣'
  WT_SWEET_PAPER:
    name: '&e&l甜度试纸'
    lore:
      - '&a可以用它来检测饮品的甜度'
      - '&7主手持果汁，副手持试纸，右键空气检测'
  WT_NIANZAO_DISABLED:
    name: '&c&l酿造工艺'
    lore:
