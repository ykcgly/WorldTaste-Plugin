item:
  WORLDTASTE_INFO:
    name: '&f&lInfo'
    lore:
      - '&7This addon was written by haiman'
      - '&7Its goal is to add foods from all over the world to Slimefun'
      - '&7These foods restore your hunger/saturation and lower exhaustion'
      - '&7Every food, based on the hunger and saturation it provides,'
      - '&7lowers the player''s exhaustion proportionally (a trait other foods lack)'
      - '&7So eating this addon''s foods makes you much less likely to get hungry again'
  WORLDTASTE_VERSINO:
    name: '&f&lVersion'
    lore:
      - '&fCurrent version:'
      - '&bRelease-1.10.1'
      - '&7You need to show this when you open an issue'
      - '&7If WorldTaste does not load fully, first check whether the Gastronomicon and ExoticGarden addons are installed on the server'
      - '&7The WorldTaste addon began on January 12, 2025'
  WORLDTASTE_TNANKS:
    name: '&f&lCredits'
    lore:
      - '&7Thanks to Big Banana and Eventually for their strong support in scripting'
      - '&7Thanks to the rsc editor written by Big Banana, which greatly reduced the tedium of writing'
      - '&7Thanks to Nankemeng for guidance on writing crops'
      - '&7Thanks to the &e&oYunmengdu server&r&7 for testing the jar version'
  WORLDTASTE_WENTI:
    name: '&a&nHaving Trouble?'
    lore:
      - '&7Please check once more, make sure the problem is not on your side, and confirm you are on the latest version'
      - '&7If the problem cannot be solved and is confirmed to be caused by this addon'
      - '&7you can open an issue on GitHub (https://github.com/ykcgly/WorldTaste-Plugin)'
      - '&7Of course, if you have good suggestions or ideas'
      - '&7you can also tell me, nya'
  WORLDTASTE_HOJI:
    name: '&e&lAfterword'
    lore:
      - '&7On August 18, 2026, the Haiman addon series announced that it would stop updating'
      - '&7WorldTaste was turned into a standalone plugin by hershate'
      - '&7providing better performance'
      - '&7Bug fixes provided by the Yangkun Farm Admin'
  WT_HAIMAN:
    name: '&6Haiman&7 (MC: &6haiman&7)'
    lore:
      - '&6Author of the Haiman addon series'
      - '&6Veteran Slimefun addon author'
      - '&7In this age where AI is everywhere'
      - '&7the old-school artists still insist on hand-crafting'
  WT_ZTF3:
    name: '&bLele Papa&7 (MC: &bZTF3&7)'
    lore:
      - '&eWorldTaste addon maintainer'
      - '&aHandled part of converting WorldTaste from rsc to jar'
      - '&7&mRedstone Heir'
  WT_YKCGLY:
    name: '&dKun Farm Admin&7 (MC: &dykcgly&7)'
    lore:
      - '&eWorldTaste addon maintainer'
      - '&aMade the addon compatible with Slimefun 4'
      - '&aFixed a large number of bugs and added some features'
      - '&7&mActually a catgirl'
  WORLDTASTE_TIP:
    name: '&f&lTips'
    lore:
      - '&6&lHunger:&e the drumsticks shown on your screen'
      - '&6&lSaturation:&e consumed before hunger is used up, and it cannot exceed your current hunger (the higher your hunger, the more saturation you gain)'
      - '&6&lExhaustion:&e increases when the player performs certain activities (such as sprinting, jumping, mining, hunger effects and so on). When exhaustion reaches 4, it resets to 0 and costs 1 point of hunger or saturation.'
      - '&6&lFull-Hunger Regeneration Rate:&e the interval between health regenerations while hunger is full (smaller is faster)'
      - '&6&lHalf-Hunger Regeneration Rate:&e the interval between health regenerations while hunger is not full (smaller is faster)'
      - '&6&lStarvation Damage Rate:&e the interval between health losses while hunger is empty (larger is slower)'
      - '&6&lWarmth:&e the player takes longer to start freezing in powder snow'
      - '&6&lOxygen:&e the oxygen bar while diving'
      - '&6&lMax Oxygen:&e the upper limit of the oxygen bar'
      - '&6&lAbsorption:&e the golden hearts'
