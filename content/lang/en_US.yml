  WT_NIANZAO_INFO:
    name: '&eBrewing Guide'
    lore:
      - '&eNew category -- Brewing'
      - '&eAdds a nearly infinite variety of drinks to WorldTaste'
      - '&7&mInspired by dreaming one night of a wine fox treading wine'
  WT_NIANZAO_JIESAO:
    name: '&bDescription'
    lore:
      - '&bThis category mainly adds two machines'
      - '&bThe Juicer Basin and the Cellar Manager'
      - '&bPut ingredients into the Juicer Basin to extract juice'
      - '&bSee the Slimefun guide for the recipes'
      - '&bThe juice can be drunk directly, or aged in the Cellar to make alcohol'
  WT_NIANZAO_TEXING:
    name: '&eNew Features'
    lore:
      - '&bThe Juicer Basin holds up to 10 types of items, 10 items in total'
      - '&7Think of it as a bundle with a capacity of 10'
      - '&bThe output always contains whatever you put in'
      - '&bSo a single bottle of juice can contain 10 ingredients'
      - '&bYou can also pour it into the Cellar to age it'
      - '&bAged juice gains alcohol content'
      - '&bAlcohol content depends on total sugar of the juice * conversion rate (default 0.3) + yeast starter bonus'
      - '&7Basic starter +0 Starter +3 Intermediate starter +6 Advanced starter +15 Superior starter +30'
      - '&bOnce brewing is done, you can age it right away'
      - '&bBrewing takes no time&mThe older the smoother'
      - '&bAlcohol content grows 5%~15% per day by default'
  WT_GUOZHA:
    name: '&7Pomace'
  WT_SWEET_PAPER:
    name: '&e&lSweetness Test Strip'
    lore:
      - '&aUse it to test the sweetness of a drink'
      - '&7Hold juice in your main hand and the test strip in your off hand, then right-click air'
  WT_NIANZAO_DISABLED:
    name: '&c&lBrewing'
    lore:
      - '&7Brewing is disabled on this server'
      - '&7The Juicer Basin, Cellar Manager and related machines are unavailable'
      - '&8To enable it, set brewing.enabled to true in config.yml'
  WT_STORY:
    name: 'Story Category'
    lore:
