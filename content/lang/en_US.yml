# ============================================================================
# WorldTaste — Language file: English (en_US)
#
# Translated from zh_CN.yml key by key: keys, order and colour codes are untouched.
#   * Runtime lookup order: current language -> zh_CN -> content/*.yml inline name/lore
#     -> raw key name, so anything left untranslated here falls back to Chinese.
#   * To change an item name or lore, edit the value in this file.
#   * Entries marked "fragment" are concatenated with + in code; keep leading and
#     trailing spaces and keep the wording continuous.
#   * & and § are both colour codes and both work; & is easier to read.
#   * Regenerate with tools/build_en_us.py (translations live in tools/en_us.tsv).
# ============================================================================

