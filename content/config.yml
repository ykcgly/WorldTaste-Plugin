# 尘世百味 全局配置
#
# 本文件默认打包在 jar 内，插件首次启动时会自动释放到 plugins/WorldTaste/config.yml。
# 之后以 plugins/WorldTaste/config.yml 为准（改完重启服务器生效，不建议热重载）。
# 若删除该文件，下次启动会重新释放一份默认配置。

# 酿造工艺（榨汁盆 / 酒窖管理器 / 温度控制器 / 果渣 / 甜度试纸 / 果酒 等）玩法总开关
brewing:
  # true = 开启玩法；false = 关闭玩法（默认值：true，即默认开启酿造玩法）
  #
  # 关闭后：
  #   1. 酿造工艺分组（ws_niangzaogongyi）下的机器与物品一律不再注册——无法合成、
  #      无法放置使用，榨汁盆/酒窖/甜度试纸相关监听与配方（juicer.yml、cellar.yml、
  #      sugar.yml）也不再加载；
  #   2. 但指南中的「酿造工艺」分类按钮仍然保留（不从菜单删除），仅在其名称后
  #      追加「已禁用」字样（见下方 disabled-suffix），分组内保留一张占位说明页
  #      （WT_NIANZAO_DISABLED）以免空分组被指南过滤。
  enabled: true

  # 关闭时在分类名称后面追加的字样（支持 & 颜色码；留空则不追加）。
  # 默认 "&r&c&l已禁用"：&r 用于断开分类名末尾可能残留的 &k（乱码）等格式码。
  disabled-suffix: "&r&c&l已禁用"

# 食物右键行为：只有蹲下才能放置（潜行+可放置落点），其余情况一律食用
#   食用的具体实现由下方 native-eat 决定（原版进食管线 / 插件直接结算）。

# 食物放置事件的外部否决处理
food:
  # 原版进食机制（food.native-eat）
  # true：食物右键交由 Minecraft 原版进食管线——按住右键出现进食/饮用动画、咀嚼音效、
  #       食用时长（饮品自动使用原版饮用音效与动作），吃完后由插件补足药水等脚本效果。
  #       「饱食度满时不可食用（要求饥饿的食物）」由原版机制天然保证。
  #       「只有蹲下才能放置」：指向可放置落点且潜行 → 原版放置；非潜行指向地面 → 仅
  #       阻止方块交互，由服务端直接开始原版进食；指向空气/落点不可放置/非方块材质 → 进食。
  #       旧版本获取的存量食物默认不可原版进食（潜行仍可放置）；如需让它们在首次右键时
  #       自动补齐可食组件（无需重新合成），开启下方 legacy-upgrade。
  #       需要服务端 1.20.5+（组件 API）；更低版本自动回退为插件结算，无需改配置。
  # false：保持旧的插件结算逻辑（右键瞬间完成食用，无进食动画）。
  #
  # 条目自动补写：从旧版本升级的配置文件若缺少本条目（或值无效），插件会自动把它补写为
  #   false 并在控制台输出提示（原版进食是新增行为，旧配置默认关闭更稳妥）；只有删除本
  #   文件让插件重新生成默认配置时，才会以 true 作为默认值。
  native-eat: true

  # 旧存档食物自动升级（food.legacy-upgrade，默认 false）
  # 仅在 native-eat=true 时有意义。true：1.9.7 之前获取的存量食物（无可食组件）在首次右键时
  #       自动补齐可食组件，此后与新生成的食物行为一致；每次食物右键会多一次组件读取检测。
  # false（默认）：不做检测（省监听开销）——存量食物不能原版进食，潜行仍可正常放置；
  #       重新合成/重新获取的新物品不受影响。
  legacy-upgrade: false

  # 实测部分附属插件会在 BlockPlaceEvent 上专项否决本插件的头颅类食物放置（权限/领地均无关，
  # 症状为潜行右键永远放不出来）。
  # true（默认）：放行这类专项否决，保证潜行右键必定能放置；放行前会先做「探针判定」——
  #              用普通圆石在同位置走一遍放置判定，普通方块也被否决（领地/权限类保护）时
  #              依然尊重否决，因此不会绕过领地等保护。放置本身仍走原版管线，手感不变。
  # false：尊重外部否决（debug.food 开启时会列出监听放置事件的候选插件名单）。
  ignore-place-veto: true

# 调试开关：排查食物右键/放置行为用，正常服保持 false。
# 开启后控制台会打印每次右键的决策过程（潜行放置 / 食用 / 不消耗），
# 以及放置事件被外部否决时的处理与候选插件名单。
debug:
  food: false
